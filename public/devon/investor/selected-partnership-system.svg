<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#f3efe7"/><rect x="70" y="70" width="1460" height="860" rx="34" fill="#fffdf8" stroke="#d9d2c7" stroke-width="2"/><text x="120" y="145" fill="#b54c35" font-family="Arial" font-size="24" font-weight="700" letter-spacing="4">PARTNERSHIP + PILOT STRATEGY</text><text x="120" y="220" fill="#161616" font-family="Arial" font-size="58" font-weight="700">A specialist layer around an existing product.</text><text x="120" y="270" fill="#6d6a65" font-family="Arial" font-size="24">Executive storytelling for product boundaries, integration logic, consent, and a low-risk pilot.</text><g font-family="Arial"><rect x="120" y="405" width="230" height="145" rx="20" fill="#161616"/><text x="155" y="462" fill="#f8f3e9" font-size="18" font-weight="700">01 / INQUIRY</text><text x="155" y="500" fill="#cfc9bf" font-size="19">A need appears.</text><rect x="395" y="405" width="230" height="145" rx="20" fill="#262626"/><text x="430" y="462" fill="#f8f3e9" font-size="18" font-weight="700">02 / ENGINE</text><text x="430" y="500" fill="#cfc9bf" font-size="19">Core workflow stays intact.</text><rect x="670" y="405" width="230" height="145" rx="20" fill="#b54c35"/><text x="705" y="462" fill="#fff" font-size="18" font-weight="700">03 / SIGNAL</text><text x="705" y="500" fill="#ffe5dc" font-size="19">A gap becomes visible.</text><rect x="945" y="405" width="230" height="145" rx="20" fill="#262626"/><text x="980" y="462" fill="#f8f3e9" font-size="18" font-weight="700">04 / SPECIALIST</text><text x="980" y="500" fill="#cfc9bf" font-size="19">Help enters if relevant.</text><rect x="1220" y="405" width="230" height="145" rx="20" fill="#161616"/><text x="1255" y="462" fill="#f8f3e9" font-size="18" font-weight="700">05 / CLOSE</text><text x="1255" y="500" fill="#cfc9bf" font-size="19">Client stays in control.</text></g><g stroke="#bcb5aa" stroke-width="4"><path d="M350 478h45"/><path d="M625 478h45"/><path d="M900 478h45"/><path d="M1175 478h45"/></g><rect x="120" y="630" width="640" height="180" rx="22" fill="#f1ece3" stroke="#ded7cb"/><text x="160" y="680" fill="#b54c35" font-family="Arial" font-size="18" font-weight="700">GUARDRAILS</text><text x="160" y="725" fill="#202020" font-family="Arial" font-size="22">System of record stays intact</text><text x="160" y="760" fill="#202020" font-family="Arial" font-size="22">Minimum data • permission first • optional handoff</text><rect x="840" y="630" width="610" height="180" rx="22" fill="#161616"/><text x="880" y="680" fill="#b54c35" font-family="Arial" font-size="18" font-weight="700">30-DAY PILOT</text><text x="880" y="725" fill="#f6f0e6" font-family="Arial" font-size="22">Choose one client • define trigger types</text><text x="880" y="760" fill="#f6f0e6" font-family="Arial" font-size="22">Automate the alert • measure value • decide</text><text x="120" y="890" fill="#7b766f" font-family="Arial" font-size="18">Anonymized from a six-page hospitality partnership concept and pilot proposal.</text></svg>