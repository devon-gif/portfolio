5" y="752" fill="#f7f3ea" font-family="Arial" font-size="21">Audit channels • consolidate assets</text><text x="155" y="785" fill="#a8a8a8" font-family="Arial" font-size="18">Map approvals and booking-path gaps</text><rect x="595" y="660" width="410" height="155" rx="20" fill="#272727"/><text x="630" y="710" fill="#d8b36a" font-family="Arial" font-size="18" font-weight="700">02 / BUILD</text><text x="630" y="752" fill="#f7f3ea" font-family="Arial" font-size="21">Launch lifecycle campaigns</text><text x="630" y="785" fill="#a8a8a8" font-family="Arial" font-size="18">Build reusable templates and pages</text><rect x="1070" y="660" width="410" height="155" rx="20" fill="#272727"/><text x="1105" y="710" fill="#d8b36a" font-family="Arial" font-size="18" font-weight="700">03 / SCALE</text><text x="1105" y="752" fill="#f7f3ea" font-family="Arial" font-size="21">Add offers, events and reporting</text><text x="1105" y="785" fill="#a8a8a8" font-family="Arial" font-size="18">Create playbooks and repeatable rhythm</text><text x="120" y="890" fill="#7f7f7f" font-family="Arial" font-size="18">Anonymized from a ten-page multi-property hospitality marketing and operations proposal.</text></svg>