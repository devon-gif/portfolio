<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1000" role="img" aria-labelledby="title desc"><title id="title">VibeCode+ website preview</title><desc id="desc">Dark neon VibeCode+ homepage preview with headline, buttons, and glowing product blocks.</desc><defs><radialGradient id="g1" cx="20%" cy="55%" r="60%"><stop offset="0" stop-color="#5517ff" stop-opacity=".55"/><stop offset=".42" stop-color="#a21caf" stop-opacity=".24"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="78%" cy="60%" r="55%"><stop offset="0" stop-color="#0891ff" stop-opacity=".45"/><stop offset=".48" stop-color="#d946ef" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><linearGradient id="stroke" x1="0" x2="1"><stop stop-color="#23a7ff"/><stop offset=".55" stop-color="#d946ef"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0.4 0 1 0 0 0.05 0 0 1 0 1 0 0 0 .8 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1520" height="1000" fill="#000"/><rect width="1520" height="1000" fill="url(#g1)"/><rect width="1520" height="1000" fill="url(#g2)"/><g opacity=".5" stroke="url(#stroke)" stroke-width="2"><path d="M0 555 C260 480 370 520 545 455 S930 350 1520 410" fill="none"/><path d="M0 795 C300 730 500 850 735 765 S1040 660 1520 710" fill="none"/></g><g opacity=".55" filter="url(#soft)"><ellipse cx="355" cy="815" rx="210" ry="32" fill="#22d3ee"/><ellipse cx="800" cy="835" rx="260" ry="40" fill="#d946ef"/><ellipse cx="1165" cy="815" rx="220" ry="36" fill="#2563eb"/></g><g transform="translate(88 68)"><text x="70" y="26" fill="#fff" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="22">VibeCode+</text><text x="525" y=