ail</text><rect x="270" width="230" height="70" rx="18" fill="#090909" stroke="#333"/><text x="320" y="43" fill="#fff" opacity=".78" font-family="Inter,Arial,sans-serif" font-size="20">See How It Works</text></g></g><g filter="url(#glow)" opacity=".78"><g transform="translate(270 620) rotate(-8)"><rect width="230" height="180" rx="28" fill="#0d0d12" stroke="url(#stroke)" stroke-width="3"/><circle cx="115" cy="90" r="46" fill="none" stroke="#a855f7" stroke-width="10"/><circle cx="115" cy="90" r="18" fill="#111" stroke="#60a5fa" stroke-width="5"/></g><g transform="translate(630 530) rotate(7)"><rect width="260" height="230" rx="30" fill="#101015" stroke="url(#stroke)" stroke-width="3"/><path d="M65 150 L120 78 L150 108 L105 165Z" fill="#60a5fa"/><path d="M125 170 L200 78" stroke="#d946ef" stroke-width="12" stroke-linecap="round"/></g><g transform="translate(1010 610) rotate(8)"><rect width="230" height="180" rx="28" fill="#0d0d12" stroke="url(#stroke)" stroke-width="3"/><circle cx="112" cy="76" r="32" fill="none" stroke="#38bdf8" stroke-width="8"/><path d="M60 145 C80 105 145 105 170 145" fill="none" stroke="#d946ef" stroke-width="10" stroke-linecap="round"/></g><g transform="translate(395 840)"><rect width="250" height="100" rx="20" fill="#0b0d12" stroke="#0ea5e9" stroke-width="3"/><rect x="18" y="24" width="214" height="52" rx="8" fill="#0f172a" stroke="#22d3ee"/></g><g transform="translate(675 845)"><rect width="260" height="100" rx="20" fill="#120b1b" stroke="#d946ef" stroke-width="3"/><rect x="18" y="24" width="224" height="52" rx="8" fill="#1e1030" stroke="#f472b6"/></g><g transform="translate(970 840)"><rect width="250" height="100" rx="20" fill="#10091a" stroke="#a855f7" stroke-width="3"/><rect x="18" y="24" width="214" height="52" rx="8" fill="#1e1b4b" stroke="#d946ef"/></g></g></svg>